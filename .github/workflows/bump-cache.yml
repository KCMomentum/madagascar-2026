name: Auto-bump service worker cache

# When a commit lands on main WITHOUT touching sw.js (e.g. a docs.json or
# index.html edit made from a phone via Claude or the GitHub web editor), bump
# the service-worker CACHE version so installed phones pull the new version on
# their next online open. Pushes that already change sw.js (deploy.sh, or this
# job's own commit) are skipped — that prevents an infinite loop.

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Bump CACHE in sw.js (only if sw.js was untouched)
        run: |
          if git diff --name-only HEAD^ HEAD | grep -qx 'sw.js'; then
            echo "sw.js already changed in this push — nothing to do."
            exit 0
          fi
          VER="mad-$(date -u +%Y-%m-%d-%H%M%S)"
          sed -i "s/^const CACHE = .*/const CACHE = '$VER';/" sw.js
          if git diff --quiet sw.js; then
            echo "sw.js unchanged after sed — nothing to do."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sw.js
          git commit -m "Auto-bump SW cache ($VER)"
          git push
