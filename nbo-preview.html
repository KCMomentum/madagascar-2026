<!doctype html><meta charset=utf-8><style>
  :root{--ink:#43301c;--cream:#f6ecd4;}
  body{margin:0;background:#fff;font-family:Helvetica,Arial,sans-serif}
  .row{display:flex;flex-wrap:wrap;gap:14px;padding:16px}
  .tile{position:relative;width:230px;height:200px;border:1px solid #0002;border-radius:4px;background:linear-gradient(#cbe8ee,#a9d4dd)}
  .num{position:absolute;bottom:6px;right:9px;font-weight:700;color:#2b3a40;font-size:13px;opacity:.85}
  .nbojump{position:absolute;top:16px;left:16px;display:flex;flex-direction:column;align-items:center;gap:0;background:none;border:none;cursor:pointer;font-family:Georgia,serif;font-weight:700;font-size:15px;letter-spacing:.3px;color:var(--ink);text-shadow:0 0 4px var(--cream),0 0 4px var(--cream),0 1px 1px var(--cream)}
  .nbojump svg{filter:drop-shadow(0 0 2px var(--cream)) drop-shadow(0 0 2px var(--cream));margin-bottom:2px}
</style>
